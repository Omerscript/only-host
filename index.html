<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZONE HOSTING - لوحة التحكم</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #7c5cff;
            --success: #32d583;
            --danger: #ff6c82;
            --warning: #ffa500;
            --bg: #0a0d14;
            --panel: #10131a;
            --border: #262b36;
            --text: #f4f6fb;
            --muted: #9199a8;
        }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f14 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(180deg, var(--panel) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #5a3fbf);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 18px;
            color: white;
        }
        
        .logo-text b {
            font-size: 11px;
            font-weight: 700;
        }
        
        .logo-text small {
            font-size: 9px;
            color: var(--muted);
            margin-top: 2px;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .login-card {
            max-width: 400px;
            margin: 40px auto;
            background: linear-gradient(135deg, var(--panel) 0%, #1a1e28 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .login-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), #5a3fbf);
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 32px;
            font-weight: 900;
            color: white;
            margin: 0 auto 12px;
            box-shadow: 0 8px 24px rgba(124, 92, 255, 0.4);
        }
        
        .login-header h1 {
            font-size: 22px;
            margin: 0 0 4px;
        }
        
        .login-header p {
            font-size: 12px;
            color: var(--muted);
            margin: 0;
        }
        
        .form-group {
            margin-bottom: 12px;
        }
        
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: #0b0e14;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text);
            font-size: 13px;
            transition: all 0.3s;
        }
        
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.1);
            outline: none;
        }
        
        .btn {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, var(--primary), #5a3fbf);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 16px;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 12px;
            border-left: 4px solid;
            display: flex;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .alert-info {
            background: rgba(33, 150, 243, 0.1);
            border-left-color: #2196F3;
            color: #2196F3;
        }
        
        .alert-error {
            background: rgba(255, 108, 130, 0.1);
            border-left-color: var(--danger);
            color: var(--danger);
        }
        
        .alert-success {
            background: rgba(50, 213, 131, 0.1);
            border-left-color: var(--success);
            color: var(--success);
        }
        
        .debug-info {
            margin-top: 20px;
            padding: 12px;
            background: #0b0e14;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            color: var(--muted);
            max-height: 200px;
            overflow-y: auto;
        }
        
        .debug-info div {
            margin: 4px 0;
            word-break: break-all;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        
        .status-indicator.online {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }
        
        .status-indicator.offline {
            background: var(--danger);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .app-view {
            display: none;
        }
        
        .app-view.active {
            display: block;
        }
        
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
            overflow-x: auto;
        }
        
        .tab {
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: var(--text);
            border-bottom-color: var(--primary);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .card {
            background: linear-gradient(135deg, var(--panel) 0%, #1a1e28 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }
        
        .stat-row:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: var(--muted);
        }
        
        .stat-value {
            font-weight: 600;
            color: var(--text);
        }
        
        .stat-value.success {
            color: var(--success);
        }
        
        .stat-value.danger {
            color: var(--danger);
        }
        
        .server-item {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .server-item:active {
            border-color: var(--primary);
            background: linear-gradient(135deg, var(--panel) 0%, #1a1e28 100%);
        }
        
        .server-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #5a3fbf);
            border-radius: 6px;
            display: grid;
            place-items: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .server-info {
            flex: 1;
            min-width: 0;
        }
        
        .server-name {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .server-meta {
            font-size: 11px;
            color: var(--muted);
        }
        
        .progress {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 6px;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #5a3fbf);
            transition: width 0.3s;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        small {
            color: var(--muted);
            font-size: 11px;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="logo-section">
            <div class="logo-icon">Z</div>
            <div class="logo-text">
                <b>ZONE HOSTING</b>
                <small>Pro Control</small>
            </div>
        </div>
        <div id="statusBadge" class="status-indicator offline"></div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <!-- LOGIN VIEW -->
        <div id="loginView" class="login-card">
            <div class="login-header">
                <div class="login-logo">Z</div>
                <h1>ZONE HOSTING</h1>
                <p>لوحة التحكم الاحترافية</p>
            </div>

            <div id="alertContainer"></div>

            <div class="form-group">
                <label>عنوان API (مثال: https://your-server.com)</label>
                <input type="text" id="apiUrl" placeholder="https://api.example.com" value="">
            </div>

            <div class="form-group">
                <label>مفتاح API السري</label>
                <input type="password" id="apiToken" placeholder="ZONEZONE123456789ZONE" value="">
            </div>

            <button id="loginBtn" class="btn">🔐 اتصال آمن</button>

            <div class="debug-info" id="debugInfo">
                <div>🔍 معلومات التشخيص:</div>
                <div id="debugLog"></div>
            </div>
        </div>

        <!-- APP VIEW -->
        <div id="appView" class="app-view">
            <div class="tabs">
                <button class="tab active" data-tab="dashboard">📊 لوحة</button>
                <button class="tab" data-tab="servers">🖥️ الخوادم</button>
                <button class="tab" data-tab="monitor">📈 مراقبة</button>
            </div>

            <!-- DASHBOARD -->
            <div id="dashboard" class="tab-content active">
                <div id="dashboardContent"></div>
            </div>

            <!-- SERVERS -->
            <div id="servers" class="tab-content">
                <button id="refreshBtn" class="btn" style="width: auto; padding: 8px 16px; margin-bottom: 12px;">🔄 تحديث</button>
                <div id="serversList"></div>
            </div>

            <!-- MONITOR -->
            <div id="monitor" class="tab-content">
                <div id="monitorContent"></div>
            </div>
        </div>
    </div>

    <script>
        // ======================== CONFIG ========================
        const CONFIG = {
            apiUrl: localStorage.getItem('zone_api') || '',
            apiToken: sessionStorage.getItem('zone_token') || '',
            updateInterval: 5000,
            autoRefresh: true,
        };

        const STATE = {
            isLoggedIn: false,
            servers: [],
            selectedServer: null,
            updateTimer: null,
            debugLogs: [],
        };

        // ======================== HELPERS ========================
        const $ = (id) => document.getElementById(id);
        const $$ = (sel) => document.querySelectorAll(sel);

        // ======================== LOGGING ========================
        function log(msg, type = 'info') {
            const now = new Date().toLocaleTimeString('ar-SA', { hour12: false });
            const log = `[${now}] ${msg}`;
            
            STATE.debugLogs.push(log);
            if (STATE.debugLogs.length > 20) STATE.debugLogs.shift();
            
            $('debugLog').innerHTML = STATE.debugLogs.map(l => `<div>${l}</div>`).join('');
            
            console.log(`[${type}]`, msg);
        }

        function showAlert(msg, type = 'info') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `<span>${type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️'}</span><span>${msg}</span>`;
            $('alertContainer').insertBefore(alert, $('alertContainer').firstChild);
            
            setTimeout(() => alert.remove(), 4000);
            
            log(msg, type);
        }

        // ======================== API REQUESTS ========================
        async function apiCall(path, method = 'GET', body = null) {
            const url = `${CONFIG.apiUrl}${path}`;

            log(`${method} ${path}`, 'request');

            const opts = {
                method,
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': '1',
                },
            };

            if (CONFIG.apiToken) {
                opts.headers['Authorization'] = `Bearer ${CONFIG.apiToken}`;
            }

            if (body) {
                opts.body = JSON.stringify(body);
            }

            try {
                const res = await fetch(url, opts);

                log(`Response: ${res.status} ${res.statusText}`, res.ok ? 'success' : 'error');

                if (!res.ok) {
                    const text = await res.text();
                    let errMsg = text;
                    try {
                        const data = JSON.parse(text);
                        errMsg = data.detail || data.message || text;
                    } catch (e) {}

                    throw new Error(`HTTP ${res.status}: ${errMsg}`);
                }

                const data = await res.json();
                updateStatusIndicator(true);
                return data;

            } catch (err) {
                updateStatusIndicator(false);

                if (err.message.includes('Failed to fetch')) {
                    log(`❌ فشل الاتصال - تحقق من:`, 'error');
                    log(`   1️⃣ عنوان API صحيح؟`, 'error');
                    log(`   2️⃣ الخادم يعمل؟`, 'error');
                    log(`   3️⃣ CORS مفعّل؟`, 'error');
                    log(`   4️⃣ الشبكة متصلة؟`, 'error');
                    showAlert('❌ فشل الاتصال - تحقق من عنوان API والشبكة', 'error');
                } else {
                    showAlert(`❌ خطأ: ${err.message}`, 'error');
                    log(`Error: ${err.message}`, 'error');
                }

                throw err;
            }
        }

        // ======================== AUTHENTICATION ========================
        function showLogin() {
            $('loginView').style.display = 'block';
            $('appView').classList.remove('active');
            STATE.isLoggedIn = false;
            clearInterval(STATE.updateTimer);
        }

        function showApp() {
            $('loginView').style.display = 'none';
            $('appView').classList.add('active');
            STATE.isLoggedIn = true;
            loadServers();
            startAutoRefresh();
        }

        $('loginBtn').onclick = async () => {
            const url = $('apiUrl').value.trim();
            const token = $('apiToken').value.trim();

            log(`محاولة الاتصال: ${url}`, 'request');

            if (!url || !token) {
                showAlert('أدخل عنوان API والمفتاح', 'error');
                return;
            }

            CONFIG.apiUrl = url;
            CONFIG.apiToken = token;
            localStorage.setItem('zone_api', url);
            sessionStorage.setItem('zone_token', token);

            $('loginBtn').disabled = true;
            $('loginBtn').innerHTML = '<span class="spinner"></span> جاري الاتصال...';

            try {
                await apiCall('/api/auth/check');
                showAlert('✅ تم الاتصال بنجاح!', 'success');
                showApp();
            } catch (err) {
                sessionStorage.removeItem('zone_token');
                CONFIG.apiToken = '';
                log(`فشل الاتصال: ${err.message}`, 'error');
            } finally {
                $('loginBtn').disabled = false;
                $('loginBtn').innerHTML = '🔐 اتصال آمن';
            }
        };

        // ======================== SERVERS ========================
        async function loadServers() {
            try {
                STATE.servers = await apiCall('/api/servers');
                renderDashboard();
                renderServers();
                showAlert(`✅ تم تحديث ${STATE.servers.length} خادم`, 'success');
                log(`تم تحميل ${STATE.servers.length} خادم`, 'success');
            } catch (err) {
                $('dashboardContent').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div>فشل تحميل الخوادم</div></div>`;
                $('serversList').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div>فشل تحميل الخوادم</div></div>`;
            }
        }

        function isOnline(server) {
            return server.status === 'online';
        }

        function renderDashboard() {
            const online = STATE.servers.filter(isOnline).length;
            const total = STATE.servers.length;

            let html = `
                <div class="card">
                    <div class="card-title">📊 الإحصائيات العامة</div>
                    <div class="stat-row">
                        <span class="stat-label">إجمالي الخوادم</span>
                        <span class="stat-value">${total}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">خوادم نشطة</span>
                        <span class="stat-value success">${online} 🟢</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">خوادم معطلة</span>
                        <span class="stat-value danger">${total - online} 🔴</span>
                    </div>
                </div>
            `;

            STATE.servers.forEach(s => {
                html += `
                    <div class="card" onclick="selectServer(${s.id})">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                            <span class="status-indicator ${isOnline(s) ? 'online' : 'offline'}"></span>
                            <span>${s.name}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">CPU</span>
                            <span class="stat-value">${s.cpu_percent !== null ? s.cpu_percent + '%' : '—'}</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" style="width: ${Math.min(s.cpu_percent || 0, 100)}%"></div>
                        </div>
                        <div class="stat-row" style="margin-top: 8px;">
                            <span class="stat-label">RAM</span>
                            <span class="stat-value">${s.ram_percent !== null ? s.ram_percent + '%' : '—'}</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" style="width: ${Math.min(s.ram_percent || 0, 100)}%"></div>
                        </div>
                    </div>
                `;
            });

            $('dashboardContent').innerHTML = html || '<div class="empty-state"><div class="empty-icon">🖥️</div><div>لا توجد خوادم</div></div>';
        }

        function renderServers() {
            let html = STATE.servers.map(s => `
                <div class="server-item" onclick="selectServer(${s.id})">
                    <div class="server-icon">${isOnline(s) ? '🟢' : '🔴'}</div>
                    <div class="server-info">
                        <div class="server-name">${s.name}</div>
                        <div class="server-meta">
                            CPU: ${s.cpu_percent || '—'}% | RAM: ${s.ram_percent || '—'}% | Disk: ${s.disk_percent || '—'}%
                        </div>
                    </div>
                </div>
            `).join('');

            $('serversList').innerHTML = html || '<div class="empty-state"><div class="empty-icon">🔍</div><div>لا توجد خوادم</div></div>';
        }

        function selectServer(id) {
            STATE.selectedServer = STATE.servers.find(s => s.id === id);
            if (STATE.selectedServer) {
                showAlert(`✅ تم اختيار: ${STATE.selectedServer.name}`, 'success');
                renderMonitor();
            }
        }

        function renderMonitor() {
            if (!STATE.selectedServer) {
                $('monitorContent').innerHTML = '<div class="empty-state">اختر خادماً أولاً</div>';
                return;
            }

            const s = STATE.selectedServer;
            const html = `
                <div class="card">
                    <div class="card-title">🖥️ ${s.name}</div>
                    <div class="stat-row">
                        <span class="stat-label">الحالة</span>
                        <span class="stat-value ${isOnline(s) ? 'success' : 'danger'}">
                            ${isOnline(s) ? '🟢 نشط' : '🔴 معطل'}
                        </span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">المعالج (CPU)</span>
                        <span class="stat-value">${s.cpu_percent || '—'}%</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" style="width: ${Math.min(s.cpu_percent || 0, 100)}%"></div>
                    </div>
                    <div class="stat-row" style="margin-top: 8px;">
                        <span class="stat-label">الذاكرة (RAM)</span>
                        <span class="stat-value">${s.ram_percent || '—'}%</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" style="width: ${Math.min(s.ram_percent || 0, 100)}%"></div>
                    </div>
                    <div class="stat-row" style="margin-top: 8px;">
                        <span class="stat-label">التخزين (Disk)</span>
                        <span class="stat-value">${s.disk_percent || '—'}%</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" style="width: ${Math.min(s.disk_percent || 0, 100)}%"></div>
                    </div>
                    <div class="stat-row" style="margin-top: 8px;">
                        <span class="stat-label">المهام الجارية</span>
                        <span class="stat-value">${s.running_jobs || '—'}</span>
                    </div>
                </div>
            `;

            $('monitorContent').innerHTML = html;
        }

        // ======================== TABS ========================
        $$('.tab').forEach(tab => {
            tab.onclick = () => {
                $$('.tab').forEach(t => t.classList.remove('active'));
                $$('.tab-content').forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                const tabId = tab.dataset.tab;
                $(tabId).classList.add('active');

                if (tabId === 'monitor') renderMonitor();
            };
        });

        // ======================== AUTO REFRESH ========================
        function startAutoRefresh() {
            if (STATE.updateTimer) clearInterval(STATE.updateTimer);
            STATE.updateTimer = setInterval(() => {
                if (STATE.isLoggedIn && CONFIG.autoRefresh) {
                    loadServers();
                }
            }, CONFIG.updateInterval);
        }

        $('refreshBtn').onclick = loadServers;

        // ======================== INITIALIZE ========================
        function updateStatusIndicator(online) {
            const badge = $('statusBadge');
            badge.className = `status-indicator ${online ? 'online' : 'offline'}`;
        }

        // Load saved config
        $('apiUrl').value = CONFIG.apiUrl;
        if (CONFIG.apiToken) {
            log('تم العثور على جلسة محفوظة', 'info');
        }

        // Try to auto-login if we have saved token
        if (CONFIG.apiUrl && CONFIG.apiToken) {
            log('محاولة تسجيل الدخول التلقائي...', 'info');
            
            $('loginBtn').disabled = true;
            $('loginBtn').innerHTML = '<span class="spinner"></span> جاري الاتصال...';
            
            apiCall('/api/auth/check')
                .then(() => {
                    showAlert('✅ تم الاتصال التلقائي!', 'success');
                    showApp();
                })
                .catch(() => {
                    showLogin();
                })
                .finally(() => {
                    $('loginBtn').disabled = false;
                    $('loginBtn').innerHTML = '🔐 اتصال آمن';
                });
        } else {
            log('في انتظار بيانات الاتصال...', 'info');
        }

        log(`ZONE HOSTING Manager Client v2.5.0`, 'success');
    </script>
</body>
</html>
